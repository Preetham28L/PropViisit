<body class="bg-light-background text-light-on-surface font-body min-h-screen flex flex-col items-center justify-center p-4 md:p-6">

  <main class="w-full max-w-md bg-light-surface border border-light-outline-variant rounded-md p-8 shadow-sm flex flex-col gap-6">
    <div class="flex flex-col items-center text-center gap-2">
      <span class="w-12 h-12 rounded bg-light-primary text-light-on-primary flex items-center justify-center">
        <span class="material-symbols-outlined text-headline-md" aria-hidden="true">admin_panel_settings</span>
      </span>
      <h1 class="font-headline text-headline-lg-mobile md:text-headline-lg text-light-on-background" data-design-text-token="headline-lg">
        Admin Portal
      </h1>
      <p class="text-body-md text-light-outline" data-design-text-token="body-md">
        Sign in to manage PropVisit listings, visit slots, and customer appointments.
      </p>
    </div>

    <form id="admin-login-form" class="flex flex-col gap-4" novalidate>
      <label data-component-id="input-field-icon" data-component-type="input-field" data-component-variant="with-icon" class="flex flex-col gap-1.5">
        <span class="text-label-lg text-light-on-surface" data-design-text-token="label-lg">Work Email</span>
        <div class="relative flex items-center">
          <span class="material-symbols-outlined absolute left-3 text-light-outline text-title-md pointer-events-none" aria-hidden="true">mail</span>
          <input id="admin-email" type="email" inputmode="email" placeholder="admin@propvisit.io" required class="w-full rounded border border-light-outline-variant bg-light-surface pl-10 pr-3.5 py-2.5 text-body-md text-light-on-surface placeholder:text-light-outline focus:border-light-primary focus:ring-1 focus:ring-light-primary">
        </div>
      </label>

      <label data-component-id="input-field-text" data-component-type="input-field" data-component-variant="password" class="flex flex-col gap-1.5">
        <span class="text-label-lg text-light-on-surface" data-design-text-token="label-lg">Password</span>
        <div class="relative flex items-center">
          <input id="admin-password" type="password" autocomplete="current-password" placeholder="Enter your password" required class="w-full rounded border border-light-outline-variant bg-light-surface pl-3.5 pr-10 py-2.5 text-body-md text-light-on-surface placeholder:text-light-outline focus:border-light-primary focus:ring-1 focus:ring-light-primary">
          <button id="toggle-password" type="button" aria-label="Show password" class="absolute right-3 text-light-outline hover:text-light-primary">
            <span class="material-symbols-outlined text-title-md" aria-hidden="true">visibility</span>
          </button>
        </div>
      </label>

      <p id="login-error" class="hidden text-body-md text-light-on-error-container bg-light-error-container px-4 py-2.5 rounded" role="alert" data-design-text-token="body-md">
        Enter a valid administrator email and password.
      </p>

      <button type="submit" data-component-id="button-primary" data-component-type="button" data-component-variant="primary" class="mt-2 w-full inline-flex items-center justify-center gap-2 px-5 py-3 rounded bg-light-primary text-light-on-primary text-label-lg hover:bg-light-secondary transition-colors duration-state-change">
        <span class="material-symbols-outlined text-title-md" aria-hidden="true">lock</span>
        <span data-design-text-token="label-lg">Sign In to Dashboard</span>
      </button>
    </form>

    <div class="pt-4 border-t border-light-outline-variant flex items-center justify-between text-label-sm text-light-outline">
      <span data-design-text-token="label-sm">JWT Role-Based Access</span>
      <a href="../customer-portal/CustomerPortal.html" class="text-light-primary hover:underline" data-design-text-token="label-sm">Return to Customer Portal</a>
    </div>
  </main>

  <script>
    const pwdInput = document.getElementById('admin-password');
    const toggleBtn = document.getElementById('toggle-password');
    toggleBtn.addEventListener('click', () => {
      const isPwd = pwdInput.type === 'password';
      pwdInput.type = isPwd ? 'text' : 'password';
      toggleBtn.querySelector('span').textContent = isPwd ? 'visibility_off' : 'visibility';
    });

    document.getElementById('admin-login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('admin-email').value.trim();
      const pwd = pwdInput.value.trim();
      const err = document.getElementById('login-error');
      if (!email.includes('@') || pwd.length < 6) {
        err.classList.remove('hidden');
        return;
      }
      window.location.href = '../admin-dashboard/AdminDashboard.html';
    });
  </script>


</body></html>
